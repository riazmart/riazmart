row.append(title,nm.el,h('label',{},'Collection'),collection,h('div',{class:'grid'},price.el,old.el),h('label',{},'Description'),desc,h('label',{},'Product images — select as many as needed'),h('div',{class:'actions'},h('button',{class:'btn light',type:'button',onclick:()=>pick.click()},'Choose Images'),pick),grid);if(!editingMode)row.append(h('div',{class:'actions'},h('button',{class:'btn danger',type:'button',onclick:()=>{row.remove();row._removed=true}},'Remove this product row')));rows.append(row);row._data=()=>({row,nm,collection,price,old,desc,selected,existing,removed,p});row._isRemoved=()=>!!row._removed;draw();return row}

const form=h('form',{onsubmit:async e=>{e.preventDefault();if(saving)return;const entries=[...rows.children].filter(r=>!r._isRemoved()).map(r=>r._data());if(!entries.length)return toast('کم از کم ایک product شامل کریں۔',true);for(const x of entries){const pr=Number(x.price.input.value),op=Number(x.old.input.value||0);if(!x.nm.input.value.trim()||!(pr>0)||!x.collection.value)return toast('ہر product کا نام، قیمت اور collection منتخب کریں۔',true);if(op&&op<=pr)return toast('Old price موجودہ قیمت سے زیادہ ہونی چاہیے۔',true)}

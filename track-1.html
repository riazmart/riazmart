<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Riaz Mart — Track Order</title>
<style>
:root{--navy:#101d3a;--orange:#f58220;--bg:#f5f6f8;--line:#e5e8ee;--muted:#687386;--green:#14834b}*{box-sizing:border-box}body{margin:0;font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:#182338}button,input{font:inherit}.top{background:var(--navy);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:12px}.top h1{font-size:18px;margin:0;flex:1}.top em{font-style:normal;color:var(--orange)}.btn{border:0;border-radius:9px;padding:10px 14px;background:var(--orange);color:#fff;font-weight:750;cursor:pointer;text-decoration:none}.btn.light{background:#fff;color:var(--navy)}main{max-width:560px;margin:auto;padding:16px 12px 60px}.card{background:#fff;border:1px solid var(--line);border-radius:13px;padding:15px;margin-bottom:12px}.field{border:1px solid var(--line);border-radius:9px;padding:11px;width:100%;margin-bottom:10px}.muted{color:var(--muted);font-size:13px}.steps{list-style:none;margin:14px 0 4px;padding:0}.steps li{position:relative;padding:0 0 18px 34px;color:var(--muted)}.steps li:before{content:"";position:absolute;left:8px;top:22px;bottom:-2px;width:2px;background:var(--line)}.steps li:last-child:before{display:none}.steps li i{position:absolute;left:0;top:2px;width:18px;height:18px;border-radius:50%;background:#fff;border:2px solid var(--line)}.steps li.done{color:#182338}.steps li.done i{background:var(--green);border-color:var(--green)}.steps li.done:before{background:var(--green)}.steps li.now{font-weight:800;color:var(--navy)}.steps li.now i{background:var(--orange);border-color:var(--orange);box-shadow:0 0 0 4px #fde6cf}.item{display:flex;justify-content:space-between;gap:10px;padding:3px 0;font-size:14px}.cancel{background:#fdebea;color:#b42318;border-radius:9px;padding:10px 12px;font-weight:700;margin-top:8px}
</style></head><body>
<header class="top"><h1>Riaz Mart <em>Track Order</em></h1><a class="btn light" href="./">Store</a></header>
<main>
<form class="card" id="f"><label class="muted">Order number</label><input class="field" id="oid" placeholder="RM-XXXXXXXXXX" autocomplete="off" required><button class="btn" type="submit" style="width:100%">Track</button></form>
<div id="out"></div>
<div id="mine"></div>
</main>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
(()=>{'use strict';const $=s=>document.querySelector(s),STEPS=[['Pending','Order received'],['Accepted','Order accepted'],['Packing','Being packed'],['Dispatched','Out for delivery'],['Delivered','Delivered']];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=n=>'Rs.'+Number(n||0).toLocaleString('en-US');
let db=null,unsub=null;
if(window.FB_CONFIG&&FB_CONFIG.apiKey){firebase.initializeApp(FB_CONFIG);db=firebase.firestore()}
function html(o){const st=o.status||'Pending',idx=STEPS.findIndex(s=>s[0]===st),items=Array.isArray(o.items)?o.items:[];
return `<div class="card"><b>${esc(o.id)}</b><div class="muted">${esc(o.name)} · ${esc(o.city)}</div>${st==='Cancelled'?'<div class="cancel">This order was cancelled.</div>':`<ul class="steps">${STEPS.map((s,i)=>`<li class="${i<idx?'done':i===idx?'done now':''}"><i></i>${s[1]}</li>`).join('')}</ul>`}</div><div class="card">${items.map(i=>`<div class="item"><span>${esc(i.name)} × ${Number(i.qty||1)}</span><b>${money(Number(i.price||0)*Number(i.qty||1))}</b></div>`).join('')}<div class="item" style="border-top:1px solid #e5e8ee;margin-top:6px;padding-top:8px"><b>Total · Cash on Delivery</b><b>${money(o.total)}</b></div></div>`}
function show(o){$('#out').innerHTML=html(o)}
function mine(){let ids=[];try{ids=JSON.parse(localStorage.getItem('rm_my_orders')||'[]')}catch(e){}const box=$('#mine');if(!ids.length||!db)return;box.innerHTML='<div class="muted" style="margin:4px 2px 8px">My orders on this phone</div>'+ids.map(i=>`<div id="m_${i}"></div>`).join('');ids.forEach(id=>db.collection('orders').doc(id).onSnapshot(d=>{const el=document.getElementById('m_'+id);if(el)el.innerHTML=d.exists?html(d.data()):''},()=>{}))}
function track(id){id=id.trim().toUpperCase();if(!db){$('#out').innerHTML='<div class="card">Tracking is not set up yet.</div>';return}if(unsub)unsub();$('#out').innerHTML='<div class="card muted">Loading…</div>';
unsub=db.collection('orders').doc(id).onSnapshot(d=>{if(!d.exists){$('#out').innerHTML='<div class="card">Order not found. Please check the number.</div>';return}show(d.data())},()=>{$('#out').innerHTML='<div class="card">Order not found. Please check the number.</div>'})}
$('#f').onsubmit=e=>{e.preventDefault();track($('#oid').value)};
const q=new URLSearchParams(location.search).get('id');if(q){$('#oid').value=q;track(q)}else mine()
})();
</script></body></html>

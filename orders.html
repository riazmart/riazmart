<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Riaz Mart — Orders</title>
<style>
:root{--navy:#101d3a;--orange:#f58220;--bg:#f5f6f8;--line:#e5e8ee;--muted:#687386;--green:#14834b;--red:#c0392b}*{box-sizing:border-box}body{margin:0;font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:#182338}button,input,select{font:inherit}button{cursor:pointer}.top{background:var(--navy);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}.top h1{font-size:18px;margin:0;flex:1}.top em{font-style:normal;color:var(--orange)}.btn{border:0;border-radius:9px;padding:9px 13px;background:var(--navy);color:#fff;font-weight:750;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}.btn.orange{background:var(--orange);color:#fff}.btn.wa{background:#25d366;color:#fff}.btn.light{background:#fff;color:var(--navy);border:1px solid var(--line)}main{max-width:1000px;margin:auto;padding:14px 12px 60px}.notice{background:#fff7e9;border:1px solid #f5d6a6;border-radius:12px;padding:12px 14px;margin-bottom:14px;color:#6e480e;font-size:13px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}.stat,.card{background:#fff;border:1px solid var(--line);border-radius:13px;padding:13px}.stat b{display:block;font-size:22px;color:var(--navy)}.stat span,.muted{font-size:12px;color:var(--muted)}.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.tools input{flex:1;min-width:160px}.field{border:1px solid var(--line);border-radius:9px;padding:10px 11px;background:#fff;min-width:0}.chips{display:flex;gap:7px;overflow:auto;margin-bottom:12px}.chips button{white-space:nowrap;border:1px solid var(--line);border-radius:999px;padding:7px 12px;background:#fff;color:var(--muted);font-size:13px;font-weight:700}.chips button.on{background:var(--navy);color:#fff}.order{margin-bottom:11px}.row{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}.oid{font-weight:850;font-size:16px;color:var(--navy);overflow-wrap:anywhere}.tag{font-size:11px;font-weight:800;border-radius:6px;background:#eef1f6;padding:3px 8px}.st-Pending{color:#a65b00;background:#fff0dc}.st-Accepted{color:#2358b8;background:#e9f0ff}.st-Packing{color:#8a6100;background:#fff6cc}.st-Dispatched{color:#7a3c9d;background:#f5eaff}.st-Delivered{color:#147444;background:#e2f7eb}.st-Cancelled{color:#b42318;background:#fdebea}.login{position:fixed;inset:0;background:var(--bg);z-index:20;display:flex;align-items:center;justify-content:center;padding:16px}.login .card{width:100%;max-width:360px;display:grid;gap:10px}.login h2{margin:0;color:var(--navy)}.details{margin:10px 0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.detail{background:#f7f8fb;border-radius:8px;padding:8px 10px;overflow-wrap:anywhere}.detail small{display:block;color:var(--muted);font-size:11px;font-weight:700}.items{background:#f7f8fb;border-radius:9px;padding:9px 11px;margin:8px 0}.item{display:flex;justify-content:space-between;gap:10px;padding:3px 0;font-size:13px}.actions{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-top:10px}.actions select{max-width:155px}.empty{text-align:center;color:var(--muted);padding:35px 12px}.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 15px;border-radius:10px;display:none;z-index:5;max-width:calc(100% - 24px)}@media(max-width:560px){main{padding:10px 8px 40px}.details{grid-template-columns:1fr}.stats{gap:6px}.stat{padding:10px}.stat b{font-size:19px}.top h1{font-size:16px}}
</style></head><body>
<header class="top"><h1>Riaz Mart <em>Orders</em></h1><button class="btn light" id="refresh">↻ Refresh</button><button class="btn light" id="export">Export Backup</button><button class="btn light" id="logout">Logout</button><a class="btn orange" href="./">View Store</a></header>
<div class="login" id="login"><form class="card" id="loginForm"><h2>Riaz Mart Admin</h2><div class="muted" id="loginMsg">Enter your password to see orders</div><input id="em" type="hidden" value="admin@riazmart.com" autocomplete="username"><input class="field" id="pw" type="password" placeholder="Password" autocomplete="current-password" required><button class="btn orange" type="submit">Sign in</button></form></div>
<main><div class="stats" id="stats"></div><div class="tools"><input class="field" id="search" placeholder="Search order, name, phone, city…"><button class="btn light" id="clearFilters">Clear filters</button></div><div class="chips" id="chips"></div><div id="list"><div class="empty">Loading orders…</div></div></main><div class="toast" id="toast"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
(()=>{'use strict';const $=s=>document.querySelector(s),STATUSES=['Pending','Accepted','Packing','Dispatched','Delivered','Cancelled'];let orders=[],filter='All',q='',lastCount=0;
const money=n=>'Rs.'+Number(n||0).toLocaleString('en-US');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const date=t=>t?new Date(t).toLocaleString('en-GB',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}):'';function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(t._t);t._t=setTimeout(()=>t.style.display='none',2500)}
function read(){render()}
let db=null;
function render(){const today=new Date().toDateString(),tod=orders.filter(o=>new Date(o.t).toDateString()===today),fresh=orders.filter(o=>(o.status||'Pending')==='Pending').length;$('#stats').innerHTML=`<div class="stat"><b>${fresh}</b><span>New orders</span></div><div class="stat"><b>${tod.length}</b><span>Orders today</span></div><div class="stat"><b>${money(tod.filter(o=>o.status!=='Cancelled').reduce((n,o)=>n+Number(o.total||0),0))}</b><span>Today's sales</span></div>`;$('#chips').innerHTML=['All',...STATUSES].map(s=>`<button type="button" class="${filter===s?'on':''}" data-filter="${s}">${s}${s==='All'?'':' ('+orders.filter(o=>(o.status||'Pending')===s).length+')'}</button>`).join('');$('#chips').querySelectorAll('button').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;render()});const query=q.toLowerCase();const list=orders.filter(o=>(filter==='All'||(o.status||'Pending')===filter)&&(!query||[o.id,o.name,o.phone,o.city,o.address].join(' ').toLowerCase().includes(query))).sort((a,b)=>Number(b.t||0)-Number(a.t||0));if(!list.length){$('#list').innerHTML='<div class="empty">No matching orders found.</div>';return}$('#list').innerHTML=list.map(o=>{const status=o.status||'Pending',items=Array.isArray(o.items)?o.items:[];return `<article class="card order"><div class="row"><span class="oid">${esc(o.id||'Order')}</span><span class="tag st-${esc(status)}">${esc(status)}</span></div><div class="muted">${esc(date(o.t))} · ${esc(o.channel||'WhatsApp')}</div><div class="details"><div class="detail"><small>CUSTOMER</small>${esc(o.name)}</div><div class="detail"><small>PHONE</small>${esc(o.phone)}</div><div class="detail"><small>CITY</small>${esc(o.city)}</div><div class="detail"><small>DELIVERY ADDRESS</small>${esc(o.address)}</div></div><div class="items">${items.length?items.map(i=>`<div class="item"><span>${esc(i.name)} × ${Number(i.qty||1)}</span><b>${money(Number(i.price||0)*Number(i.qty||1))}</b></div>`).join(''):'No item details'}<div class="item" style="border-top:1px solid #e5e8ee;margin-top:5px;padding-top:7px"><b>Total · COD</b><b>${money(o.total)}</b></div></div><div class="actions"><select class="field" data-id="${esc(o.id)}" aria-label="Change order status">${STATUSES.map(s=>`<option ${s===status?'selected':''}>${s}</option>`).join('')}</select><a class="btn" href="tel:${esc(o.phone)}">Call</a><a class="btn wa" target="_blank" rel="noopener" href="https://wa.me/${String(o.phone||'').replace(/\D/g,'').replace(/^0/,'92')}?text=${encodeURIComponent('Assalam o Alaikum '+(o.name||'')+', regarding your Riaz Mart order '+(o.id||''))}">WhatsApp</a><button class="btn light" data-delete="${esc(o.id)}">Delete</button></div></article>`}).join('');$('#list').querySelectorAll('select[data-id]').forEach(sel=>sel.onchange=()=>{const o=orders.find(x=>String(x.id)===sel.dataset.id);if(o){db.collection('orders').doc(sel.dataset.id).update({status:sel.value}).then(()=>toast('Order status updated')).catch(e=>toast('Error: '+e.message))}});$('#list').querySelectorAll('button[data-delete]').forEach(b=>b.onclick=()=>{if(!confirm('Delete this order permanently?'))return;db.collection('orders').doc(b.dataset.delete).delete().then(()=>toast('Order deleted')).catch(e=>toast('Error: '+e.message))})}
$('#search').oninput=e=>{q=e.target.value;render()};$('#clearFilters').onclick=()=>{q='';filter='All';$('#search').value='';render()};$('#refresh').onclick=()=>{read();toast('Refreshed')};$('#logout').onclick=()=>{if(window.firebase&&firebase.apps.length)firebase.auth().signOut()};$('#export').onclick=()=>{const blob=new Blob([JSON.stringify(orders,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='riaz-mart-orders-backup.json';a.click();URL.revokeObjectURL(url)};const lm=$('#loginMsg');
if(!(window.FB_CONFIG&&FB_CONFIG.apiKey)){lm.textContent='firebase-config.js is empty. Paste your Firebase config first.';$('#loginForm').querySelector('button').disabled=true}
else{firebase.initializeApp(FB_CONFIG);db=firebase.firestore();const auth=firebase.auth();let unsub=null,first=true;
$('#loginForm').onsubmit=e=>{e.preventDefault();lm.textContent='Signing in…';auth.signInWithEmailAndPassword($('#em').value.trim(),$('#pw').value).catch(e=>{const c=(e&&e.code)||String(e);lm.textContent=/invalid-credential|wrong-password|user-not-found|invalid-login/.test(c)?'Wrong password (or email not matching Firebase user). Code: '+c:'Error: '+c})};
auth.onAuthStateChanged(u=>{if(unsub){unsub();unsub=null}if(!u){$('#login').style.display='flex';return}$('#login').style.display='none';first=true;
unsub=db.collection('orders').orderBy('t','desc').onSnapshot(snap=>{const prev=lastCount;orders=snap.docs.map(d=>({...d.data(),id:d.id}));lastCount=orders.length;{const pn=orders.filter(x=>(x.status||'Pending')==='Pending').length;document.title=(pn?'('+pn+') ':'')+'Riaz Mart Orders'}if(!first&&orders.length>prev)toast('New order received!');first=false;render()},err=>{toast('Error: '+err.message)})})}
})();
</script></body></html>
